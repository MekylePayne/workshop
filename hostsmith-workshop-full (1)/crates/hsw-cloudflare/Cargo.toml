[package]
name = "hsw-cloudflare"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "HostSmith Workshop Cloudflare integration: native Pages asset upload, Workers scripts, token storage"

[dependencies]
base64 = { workspace = true }
blake3 = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }

# Windows Credential Manager is only linked on Windows targets (TL-10).
[target.'cfg(windows)'.dependencies]
keyring = "3"

[dev-dependencies]
tokio = { workspace = true }
tiny_http = { workspace = true }
tempfile = { workspace = true }
